<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы</title>
    <link href="file:///android_asset/css/bootstrap.min.css" rel="stylesheet">
    <link href="file:///android_asset/fwa/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; padding-bottom: 80px; }
        .balance-card {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            border-radius: 20px;
        }
        .transaction-card { border-radius: 16px; border: none; }
        .icon-box {
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 20px;
        }
        .icon-income { background-color: #d1e7dd; color: #198754; }
        .icon-expense { background-color: #f8d7da; color: #dc3545; }
        /* Плавающая кнопка (FAB) */
        .fab {
            position: fixed; bottom: 24px; right: 24px;
            width: 60px; height: 60px;
            border-radius: 30px; font-size: 24px;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
            z-index: 1050; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="balance-card p-4 mb-4 shadow-sm">
        <p class="mb-1 opacity-75">Общий баланс</p>
        <h2 class="fw-bold mb-3" id="totalBalance">0 ₽</h2>
        <div class="d-flex justify-content-between text-sm">
            <div><i class="fa-solid fa-arrow-down text-success me-1"></i> <span id="totalIncome">0 ₽</span></div>
            <div><i class="fa-solid fa-arrow-up text-danger me-1"></i> <span id="totalExpense">0 ₽</span></div>
        </div>
    </div>

    <h6 class="text-muted fw-bold mb-3 px-1">История операций</h6>
    <div id="transactionsList" class="d-flex flex-column gap-2">
        </div>
</div>

<button class="btn btn-primary fab" onclick="showAddModal()">
    <i class="fa-solid fa-plus"></i>
</button>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered align-items-end mb-0" style="min-height: 100vh;">
        <div class="modal-content border-0 rounded-top-4" style="border-bottom-left-radius: 0; border-bottom-right-radius: 0;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Новая операция</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="btn-group w-100 mb-3" role="group">
                    <input type="radio" class="btn-check" name="txType" id="typeExpense" value="expense" checked>
                    <label class="btn btn-outline-danger" for="typeExpense">Расход</label>

                    <input type="radio" class="btn-check" name="txType" id="typeIncome" value="income">
                    <label class="btn btn-outline-success" for="typeIncome">Доход</label>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small mb-1">Сумма (₽)</label>
                    <input type="number" id="txAmount" class="form-control form-control-lg fw-bold" placeholder="0" inputmode="decimal">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small mb-1">Категория</label>
                    <select id="txCategory" class="form-select form-select-lg">
                        <option value="Продукты">🛒 Продукты</option>
                        <option value="Транспорт">🚕 Транспорт</option>
                        <option value="Развлечения">🍿 Развлечения</option>
                        <option value="Здоровье">💊 Здоровье</option>
                        <option value="Бизнес (Запчасти)">🔧 Бизнес (Запчасти)</option>
                        <option value="Прочее">📌 Прочее</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small mb-1">Заметка</label>
                    <input type="text" id="txNote" class="form-control" placeholder="Комментарий...">
                </div>

                <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold" onclick="saveTransaction()">
                    Сохранить
                </button>
            </div>
        </div>
    </div>
</div>

<script src="file:///android_asset/js/bootstrap.bundle.min.js"></script>
<script>
    const DB_NAME = "finance_bus.db"; // ОБЩАЯ ШИНА ДАННЫХ
    const addModal = new bootstrap.Modal(document.getElementById('addModal'));

    // 1. Инициализация БД
    function initDb() {
        if (!window.Android || !window.Android.executeSql) {
            console.error("Android Bridge недоступен.");
            document.getElementById('transactionsList').innerHTML = '<p class="text-center text-muted">Запустите внутри Kontach</p>';
            return;
        }

        // Создаем таблицу, если ее нет. 
        // source_app - метка, откуда пришла транзакция (finance или crm)
        const sql = `
            CREATE TABLE IF NOT EXISTS transactions (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                type TEXT, 
                amount REAL,
                category TEXT,
                note TEXT,
                timestamp INTEGER,
                source_app TEXT DEFAULT 'finance' 
            )
        `;
        window.Android.executeSql(DB_NAME, sql);
        loadData();
    }

    // 2. Загрузка данных
    function loadData() {
        const sql = "SELECT * FROM transactions ORDER BY timestamp DESC";
        const jsonResult = window.Android.querySql(DB_NAME, sql);
        const transactions = JSON.parse(jsonResult);
        
        renderUI(transactions);
    }

    // 3. Отрисовка интерфейса (Баланс и Список)
    function renderUI(transactions) {
        let totalIncome = 0;
        let totalExpense = 0;
        const listContainer = document.getElementById('transactionsList');
        listContainer.innerHTML = '';

        if (transactions.length === 0) {
            listContainer.innerHTML = '<p class="text-center text-muted mt-4">Нет операций</p>';
        }

        transactions.forEach(tx => {
            const amount = parseFloat(tx.amount);
            if (tx.type === 'income') totalIncome += amount;
            else totalExpense += amount;

            const isIncome = tx.type === 'income';
            const sign = isIncome ? '+' : '-';
            const colorClass = isIncome ? 'text-success' : '';
            const iconClass = isIncome ? 'icon-income fa-arrow-down' : 'icon-expense fa-cart-shopping'; // Можно усложнить маппинг иконок
            
            // Форматирование даты
            const dateStr = new Date(tx.timestamp).toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

            listContainer.innerHTML += `
                <div class="card transaction-card shadow-sm mb-1" onclick="deleteTx(${tx.id})">
                    <div class="card-body p-3 d-flex align-items-center">
                        <div class="icon-box ${isIncome ? 'icon-income' : 'icon-expense'} me-3 flex-shrink-0">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                        <div class="flex-grow-1 overflow-hidden">
                            <h6 class="mb-0 fw-bold text-truncate">${tx.category}</h6>
                            <small class="text-muted text-truncate d-block">${tx.note || dateStr}</small>
                        </div>
                        <div class="text-end flex-shrink-0 ms-2">
                            <h6 class="mb-0 fw-bold ${colorClass}">${sign}${amount} ₽</h6>
                            ${tx.source_app === 'crm' ? '<span class="badge bg-info" style="font-size: 0.6rem;">CRM</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        });

        // Обновляем шапку
        document.getElementById('totalBalance').innerText = (totalIncome - totalExpense) + ' ₽';
        document.getElementById('totalIncome').innerText = totalIncome + ' ₽';
        document.getElementById('totalExpense').innerText = totalExpense + ' ₽';
    }

    // 4. Логика добавления
    function showAddModal() {
        document.getElementById('txAmount').value = '';
        document.getElementById('txNote').value = '';
        addModal.show();
    }

    function saveTransaction() {
        const type = document.querySelector('input[name="txType"]:checked').value;
        const amount = parseFloat(document.getElementById('txAmount').value);
        const category = document.getElementById('txCategory').value;
        const note = document.getElementById('txNote').value.replace(/'/g, "''"); // экранирование кавычек
        const ts = Date.now();

        if (isNaN(amount) || amount <= 0) {
            alert("Введите корректную сумму");
            return;
        }

        const sql = `
            INSERT INTO transactions (type, amount, category, note, timestamp, source_app) 
            VALUES ('${type}', ${amount}, '${category}', '${note}', ${ts}, 'finance')
        `;
        
        window.Android.executeSql(DB_NAME, sql);
        addModal.hide();
        loadData();
    }

    // 5. Удаление (по тапу на транзакцию)
    function deleteTx(id) {
        if (confirm("Удалить операцию?")) {
            window.Android.executeSql(DB_NAME, `DELETE FROM transactions WHERE id=${id}`);
            loadData();
        }
    }

    // Старт
    window.addEventListener('DOMContentLoaded', initDb);
</script>
</body>
</html>
