<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы</title>
    <link href="file:///android_asset/css/bootstrap.min.css" rel="stylesheet">
    <link href="file:///android_asset/fwa/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; padding-bottom: 80px; }
        
        .accounts-scroll {
            display: flex; overflow-x: auto; gap: 12px; padding-bottom: 10px;
            scrollbar-width: none;
        }
        .accounts-scroll::-webkit-scrollbar { display: none; }
        
        .account-card {
            min-width: 140px; border-radius: 16px; color: white; padding: 16px;
            position: relative; overflow: hidden; border: none;
        }
        .acc-cash { background: linear-gradient(135deg, #198754 0%, #146c43 100%); }
        .acc-card { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); }
        .acc-credit { background: linear-gradient(135deg, #dc3545 0%, #b02a37 100%); }
        .acc-add { background: #e9ecef; color: #6c757d; border: 2px dashed #ced4da; min-width: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px;}
        
        .transaction-card { border-radius: 16px; border: none; cursor: pointer; }
        .icon-box {
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 20px; flex-shrink: 0;
        }
        .icon-income { background-color: #d1e7dd; color: #198754; }
        .icon-expense { background-color: #f8d7da; color: #dc3545; }
        
        .fab {
            position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px;
            border-radius: 30px; font-size: 24px; box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
            z-index: 1040; display: flex; align-items: center; justify-content: center;
        }
        
        #addCategoryModal { z-index: 1060; }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-end mb-3 px-1">
        <h5 class="fw-bold mb-0">Мои счета</h5>
        <h5 class="fw-bold mb-0 text-primary" id="totalBalanceAll">0 ₽</h5>
    </div>

    <div class="accounts-scroll px-1" id="accountsList"></div>

    <h6 class="text-muted fw-bold mb-3 mt-4 px-1">История операций</h6>
    <div id="transactionsList" class="d-flex flex-column gap-2"></div>
</div>

<button class="btn btn-primary fab" onclick="showAddModal()">
    <i class="fa-solid fa-plus"></i>
</button>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered align-items-end mb-0" style="min-height: 100vh;">
        <div class="modal-content border-0 rounded-top-4" style="border-bottom-left-radius: 0; border-bottom-right-radius: 0;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="txModalTitle">Новая операция</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="txId">

                <div class="btn-group w-100 mb-3" role="group">
                    <input type="radio" class="btn-check" name="txType" id="typeExpense" value="expense" checked onchange="updateCategorySelect()">
                    <label class="btn btn-outline-danger" for="typeExpense">Расход</label>
                    <input type="radio" class="btn-check" name="txType" id="typeIncome" value="income" onchange="updateCategorySelect()">
                    <label class="btn btn-outline-success" for="typeIncome">Доход</label>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small mb-1">Сумма (₽)</label>
                    <input type="number" id="txAmount" class="form-control form-control-lg fw-bold" placeholder="0" inputmode="decimal">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small mb-1">Счет списания / пополнения</label>
                    <select id="txAccount" class="form-select form-select-lg fw-bold text-primary"></select>
                </div>

                <div class="d-flex gap-2 mb-3 align-items-end">
                    <div class="flex-grow-1">
                        <label class="form-label text-muted small mb-1">Категория</label>
                        <select id="txCategory" class="form-select form-select-lg"></select>
                    </div>
                    <button class="btn btn-outline-primary shadow-sm" style="height: calc(1.5em + 1rem + 2px);" onclick="showCategoryModal()">
                        <i class="fa-solid fa-folder-plus"></i>
                    </button>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small mb-1">Заметка</label>
                    <input type="text" id="txNote" class="form-control" placeholder="Комментарий...">
                </div>

                <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold mb-2" onclick="saveTransaction()">Сохранить</button>
                <button class="btn btn-outline-danger w-100 py-2 rounded-3 d-none" id="btnDeleteTx" onclick="deleteTx()">Удалить операцию</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addAccountModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-bold">Добавить счет</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label text-muted small mb-1">Название (например, Сбербанк)</label>
                    <input type="text" id="newAccName" class="form-control" placeholder="Моя карта">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small mb-1">Тип счета</label>
                    <select id="newAccType" class="form-select">
                        <option value="card">💳 Дебетовая карта</option>
                        <option value="cash">💵 Наличные</option>
                        <option value="credit">🏦 Кредитка / Долг</option>
                    </select>
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="saveNewAccount()">Создать счет</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-bold" id="categoryModalTitle">Новая категория</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newCategoryName" class="form-control mb-3" placeholder="Название (например, Кофе)">
                <button class="btn btn-primary w-100 fw-bold" onclick="saveNewCategory()">Добавить категорию</button>
            </div>
        </div>
    </div>
</div>

<script src="file:///android_asset/js/bootstrap.bundle.min.js"></script>
<script>
    const DB_NAME = "finance_bus.db";
    let allCategories = [];
    let allAccounts = [];
    let allTransactions = [];
    
    const addModal = new bootstrap.Modal(document.getElementById('addModal'));
    const accModal = new bootstrap.Modal(document.getElementById('addAccountModal'));
    const categoryModal = new bootstrap.Modal(document.getElementById('addCategoryModal'));

    function initDb() {
        if (!window.Android) return;

        window.Android.executeSql(DB_NAME, `CREATE TABLE IF NOT EXISTS transactions (id INTEGER PRIMARY KEY AUTOINCREMENT, type TEXT, amount REAL, category TEXT, note TEXT, timestamp INTEGER, source_app TEXT DEFAULT 'finance')`);
        window.Android.executeSql(DB_NAME, `CREATE TABLE IF NOT EXISTS categories (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, type TEXT)`);
        window.Android.executeSql(DB_NAME, `CREATE TABLE IF NOT EXISTS accounts (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, type TEXT)`);

        try { window.Android.executeSql(DB_NAME, `ALTER TABLE transactions ADD COLUMN account_id INTEGER DEFAULT 1`); } catch(e) {}

        seedDataIfEmpty();
        loadAllData();
    }

    function seedDataIfEmpty() {
        try {
            const resCat = JSON.parse(window.Android.querySql(DB_NAME, "SELECT COUNT(*) as c FROM categories"));
            if (resCat[0].c === 0) {
                const defCat = ["('Продукты', 'expense')", "('Транспорт', 'expense')", "('Бизнес (Запчасти)', 'expense')", "('Зарплата', 'income')", "('Услуги ремонта', 'income')"];
                window.Android.executeSql(DB_NAME, `INSERT INTO categories (name, type) VALUES ${defCat.join(',')}`);
            }
        } catch (e) {}

        try {
            const resAcc = JSON.parse(window.Android.querySql(DB_NAME, "SELECT COUNT(*) as c FROM accounts"));
            if (resAcc[0].c === 0) {
                window.Android.executeSql(DB_NAME, `INSERT INTO accounts (id, name, type) VALUES (1, 'Наличные', 'cash')`);
                window.Android.executeSql(DB_NAME, `INSERT INTO accounts (id, name, type) VALUES (2, 'Основная карта', 'card')`);
            }
        } catch (e) {}
    }

    function loadAllData() {
        allCategories = JSON.parse(window.Android.querySql(DB_NAME, "SELECT * FROM categories ORDER BY name ASC"));
        allAccounts = JSON.parse(window.Android.querySql(DB_NAME, "SELECT * FROM accounts ORDER BY id ASC"));
        allTransactions = JSON.parse(window.Android.querySql(DB_NAME, "SELECT * FROM transactions ORDER BY timestamp DESC LIMIT 100")); 
        
        updateCategorySelect();
        updateAccountSelect();
        calculateAndRender();
    }

    function calculateAndRender() {
        const allTx = JSON.parse(window.Android.querySql(DB_NAME, "SELECT type, amount, account_id FROM transactions"));
        
        let balances = {};
        allAccounts.forEach(acc => balances[acc.id] = 0);
        let totalAll = 0;

        allTx.forEach(tx => {
            const amt = parseFloat(tx.amount);
            const accId = tx.account_id || 1; 
            
            if (balances[accId] !== undefined) {
                if (tx.type === 'income') { balances[accId] += amt; totalAll += amt; } 
                else { balances[accId] -= amt; totalAll -= amt; }
            }
        });

        const accContainer = document.getElementById('accountsList');
        accContainer.innerHTML = '';
        const icons = { 'cash': 'fa-wallet', 'card': 'fa-credit-card', 'credit': 'fa-building-columns' };

        allAccounts.forEach(acc => {
            const balance = balances[acc.id] || 0;
            accContainer.innerHTML += `
                <div class="card account-card shadow-sm acc-${acc.type}">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <i class="fa-solid ${icons[acc.type] || 'fa-wallet'} fs-5 opacity-75"></i>
                    </div>
                    <small class="opacity-75 text-truncate d-block" style="max-width: 100px;">${acc.name}</small>
                    <h5 class="fw-bold mb-0 mt-1">${balance.toLocaleString('ru-RU')} ₽</h5>
                </div>
            `;
        });

        accContainer.innerHTML += `
            <div class="card account-card shadow-sm acc-add" onclick="showAddAccountModal()">
                <i class="fa-solid fa-plus"></i>
            </div>
        `;

        document.getElementById('totalBalanceAll').innerText = totalAll.toLocaleString('ru-RU') + ' ₽';

        const listContainer = document.getElementById('transactionsList');
        listContainer.innerHTML = '';
        if (allTransactions.length === 0) listContainer.innerHTML = '<p class="text-center text-muted mt-4">Нет операций</p>';

        allTransactions.forEach(tx => {
            const isIncome = tx.type === 'income';
            const sign = isIncome ? '+' : '-';
            const colorClass = isIncome ? 'text-success' : '';
            const iconClass = isIncome ? 'icon-income fa-arrow-down' : 'icon-expense fa-cart-shopping';
            const dateStr = new Date(tx.timestamp).toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            
            const acc = allAccounts.find(a => a.id === (tx.account_id || 1));
            const accName = acc ? acc.name : 'Счет удален';

            // ИЗМЕНЕНИЕ: Теперь клик вызывает openEditTxModal, а не deleteTx
            listContainer.innerHTML += `
                <div class="card transaction-card shadow-sm mb-1" onclick="openEditTxModal(${tx.id})">
                    <div class="card-body p-3 d-flex align-items-center">
                        <div class="icon-box ${isIncome ? 'icon-income' : 'icon-expense'} me-3">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                        <div class="flex-grow-1 overflow-hidden">
                            <h6 class="mb-0 fw-bold text-truncate">${tx.category}</h6>
                            <small class="text-muted text-truncate d-block">${accName} • ${dateStr}</small>
                        </div>
                        <div class="text-end flex-shrink-0 ms-2">
                            <h6 class="mb-0 fw-bold ${colorClass}">${sign}${parseFloat(tx.amount).toLocaleString('ru-RU')} ₽</h6>
                            ${tx.source_app === 'crm' ? '<span class="badge bg-info" style="font-size: 0.6rem;">CRM</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // === ЛОГИКА РЕДАКТИРОВАНИЯ И ДОБАВЛЕНИЯ ТРАНЗАКЦИЙ ===

    function showAddModal() {
        // Очищаем форму для создания НОВОЙ операции
        document.getElementById('txId').value = '';
        document.getElementById('txModalTitle').innerText = 'Новая операция';
        document.getElementById('txAmount').value = '';
        document.getElementById('txNote').value = '';
        
        // Прячем кнопку удаления
        document.getElementById('btnDeleteTx').classList.add('d-none');
        
        updateCategorySelect();
        addModal.show();
    }

    function openEditTxModal(id) {
        // Находим транзакцию в загруженном массиве
        const tx = allTransactions.find(t => t.id === id);
        if (!tx) return;

        // ВАЖНО: Защита от редактирования транзакций из CRM
        if (tx.source_app === 'crm') {
            alert("Эта операция привязана к рабочему заказу.\n\nДля изменения суммы или удаления, пожалуйста, отредактируйте сам заказ в мини-приложении 'CRM'.");
            return;
        }

        // Заполняем данные для РЕДАКТИРОВАНИЯ
        document.getElementById('txId').value = tx.id;
        document.getElementById('txModalTitle').innerText = 'Редактировать операцию';
        
        // Переключаем радио-кнопку
        if (tx.type === 'income') document.getElementById('typeIncome').checked = true;
        else document.getElementById('typeExpense').checked = true;
        
        // Обязательно обновляем список категорий перед тем как выбрать нужную
        updateCategorySelect();
        
        document.getElementById('txAmount').value = tx.amount;
        document.getElementById('txAccount').value = tx.account_id || 1;
        document.getElementById('txCategory').value = tx.category;
        document.getElementById('txNote').value = tx.note || '';

        // Показываем красную кнопку "Удалить"
        document.getElementById('btnDeleteTx').classList.remove('d-none');
        addModal.show();
    }

    function saveTransaction() {
        const id = document.getElementById('txId').value;
        const type = document.querySelector('input[name="txType"]:checked').value;
        const amount = parseFloat(document.getElementById('txAmount').value);
        const category = document.getElementById('txCategory').value;
        const accId = parseInt(document.getElementById('txAccount').value) || 1;
        const note = document.getElementById('txNote').value.replace(/'/g, "''");
        
        if (isNaN(amount) || amount <= 0) { alert("Укажите корректную сумму"); return; }

        if (id) {
            // Если есть ID - обновляем существующую запись
            window.Android.executeSql(DB_NAME, `
                UPDATE transactions 
                SET type='${type}', amount=${amount}, category='${category}', note='${note}', account_id=${accId} 
                WHERE id=${id}
            `);
        } else {
            // Если ID нет - создаем новую
            window.Android.executeSql(DB_NAME, `
                INSERT INTO transactions (type, amount, category, note, timestamp, source_app, account_id) 
                VALUES ('${type}', ${amount}, '${category}', '${note}', ${Date.now()}, 'finance', ${accId})
            `);
        }
        
        addModal.hide();
        loadAllData();
    }

    function deleteTx() {
        const id = document.getElementById('txId').value;
        if (!id) return; // Защита от случайного нажатия

        if (confirm("Вы уверены, что хотите безвозвратно удалить эту операцию?")) {
            window.Android.executeSql(DB_NAME, `DELETE FROM transactions WHERE id=${id}`);
            addModal.hide();
            loadAllData();
        }
    }

    // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (КАТЕГОРИИ И СЧЕТА) ===

    function updateCategorySelect() {
        const type = document.querySelector('input[name="txType"]:checked').value;
        const select = document.getElementById('txCategory');
        select.innerHTML = '';
        
        const filtered = allCategories.filter(c => c.type === type);
        if (filtered.length === 0) {
            select.innerHTML = '<option value="">(Нет категорий)</option>';
        } else {
            filtered.forEach(c => select.innerHTML += `<option value="${c.name}">${c.name}</option>`);
        }
    }

    function updateAccountSelect() {
        const select = document.getElementById('txAccount');
        select.innerHTML = '';
        allAccounts.forEach(a => select.innerHTML += `<option value="${a.id}">${a.name}</option>`);
    }

    function showAddAccountModal() {
        document.getElementById('newAccName').value = '';
        accModal.show();
    }

    function saveNewAccount() {
        const name = document.getElementById('newAccName').value.trim().replace(/'/g, "''");
        const type = document.getElementById('newAccType').value;
        if (!name) return;
        
        window.Android.executeSql(DB_NAME, `INSERT INTO accounts (name, type) VALUES ('${name}', '${type}')`);
        accModal.hide();
        loadAllData();
    }

    function showCategoryModal() {
        document.getElementById('newCategoryName').value = '';
        const selectedType = document.querySelector('input[name="txType"]:checked').value;
        const typeRu = selectedType === 'expense' ? 'расхода' : 'дохода';
        document.getElementById('categoryModalTitle').innerText = `Новая категория ${typeRu}`;
        
        addModal.hide();
        setTimeout(() => categoryModal.show(), 400); 
    }

    function saveNewCategory() {
        const name = document.getElementById('newCategoryName').value.trim().replace(/'/g, "''");
        if (!name) return;

        const type = document.querySelector('input[name="txType"]:checked').value;
        window.Android.executeSql(DB_NAME, `INSERT INTO categories (name, type) VALUES ('${name}', '${type}')`);
        
        categoryModal.hide();
        
        allCategories = JSON.parse(window.Android.querySql(DB_NAME, "SELECT * FROM categories ORDER BY name ASC"));
        updateCategorySelect();
        
        setTimeout(() => {
            addModal.show();
            document.getElementById('txCategory').value = name;
        }, 400);
    }

    window.addEventListener('DOMContentLoaded', initDb);
</script>
</body>
</html>
